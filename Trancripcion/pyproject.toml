[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-transcripcion"
version = "0.1.0"
description = "CLI para transcribir audio y generar salidas para sistematizaci?n"
requires-python = ">=3.10"
dependencies = ["openai>=2.0.0"]

[project.scripts]
ai-transcripcion = "ai_transcripcion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
